version: "3.9"

services:
  traefik:
    image: traefik:v3.6.1
    command:
      - --providers.swarm.endpoint=unix:///var/run/docker.sock
      - --providers.swarm.exposedbydefault=false
      - --providers.swarm.network=demo_public
      - --entrypoints.web.address=:80
      - --entrypoints.traefik.address=:8080
      - --api.dashboard=true
      - --log.level=DEBUG
      - --accesslog=true
    ports:
      - target: 80
        published: 8090
        protocol: tcp
        mode: ingress
      - target: 8080
        published: 8080
        protocol: tcp
        mode: ingress
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - public
    deploy:
      placement:
        constraints:
          - node.role == manager
      labels:
        - traefik.enable=true
        - traefik.swarm.network=demo_public
        - traefik.http.routers.traefik.rule=PathPrefix(`/api`) || PathPrefix(`/dashboard`)
        - traefik.http.routers.traefik.entrypoints=traefik
        - traefik.http.routers.traefik.service=api@internal
        - traefik.http.services.dummy-svc.loadbalancer.server.port=9999

  frontend:
    image: registry.local:5000/swarm-demo-frontend:0.0.1
    networks:
      - public
    deploy:
      labels:
        - traefik.enable=true
        - traefik.swarm.network=demo_public
        - traefik.http.routers.frontend.rule=PathPrefix(`/`)
        - traefik.http.routers.frontend.entrypoints=web
        - traefik.http.routers.frontend.priority=1
        - traefik.http.services.frontend.loadbalancer.server.port=80

  backend:
    image: registry.local:5000/swarm-demo-backend:0.0.2
    configs:
      - source: pg_db_name
        target: /run/configs/pg_db_name
      - source: pg_db_user
        target: /run/configs/pg_db_user
      - source: backend_service_name
        target: /run/configs/backend_service_name
      - source: backend_gpu_node
        target: /run/configs/backend_gpu_node
    secrets:
      - source: pg_password
        target: pg_password
    networks:
      - public
      - app_net
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
      labels:
        - traefik.enable=true
        - traefik.swarm.network=demo_public
        - traefik.http.routers.backend.rule=PathPrefix(`/api`)
        - traefik.http.routers.backend.entrypoints=web
        - traefik.http.routers.backend.priority=100
        - traefik.http.services.backend.loadbalancer.server.port=8000

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    secrets:
      - source: pg_password
        target: pg_password
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - app_net
    deploy:
      placement:
        constraints:
          - node.labels.db == true

networks:
  public:
    name: "demo_public"
    driver: overlay
    attachable: true
  app_net:
    name: "demo_app_net"
    driver: overlay
    attachable: true

volumes:
  pg_data:

configs:
  pg_db_name:
    external: true
  pg_db_user:
    external: true
  backend_service_name:
    external: true
  backend_gpu_node:
    external: true

secrets:
  pg_password:
    external: true
