version: "3.9"

services:
  traefik:
    image: traefik:v3.6.1
    command:
      - --providers.swarm.endpoint=unix:///var/run/docker.sock
      - --providers.swarm.exposedbydefault=false
      - --providers.swarm.network=demo_public
      - --entrypoints.web.address=:80
      - --entrypoints.traefik.address=:8080
      - --api.dashboard=true
      - --log.level=DEBUG
      - --accesslog=true
    ports:
      - target: 80
        published: 8090
        protocol: tcp
        mode: ingress
      - target: 8080
        published: 8080
        protocol: tcp
        mode: ingress
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - public
    deploy:
      placement:
        constraints:
          - node.role == manager
      labels:
        - traefik.enable=true
        - traefik.swarm.network=demo_public
        - traefik.http.routers.traefik.rule=PathPrefix(`/api`) || PathPrefix(`/dashboard`)
        - traefik.http.routers.traefik.entrypoints=traefik
        - traefik.http.routers.traefik.service=api@internal
        - traefik.http.services.dummy-svc.loadbalancer.server.port=9999

  frontend:
    image: swarm-demo-frontend:latest
    networks:
      - public
    deploy:
      labels:
        - traefik.enable=true
        - traefik.swarm.network=demo_public
        - traefik.http.routers.frontend.rule=PathPrefix(`/`)
        - traefik.http.routers.frontend.entrypoints=web
        - traefik.http.routers.frontend.priority=1
        - traefik.http.services.frontend.loadbalancer.server.port=80

  backend:
    image: swarm-demo-backend:latest
    environment:
      POSTGRES_DB: "appdb"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "secret-password"
      SERVICE_NAME: "backend"
      GPU_NODE: "false"
    networks:
      - public
      - app_net
    deploy:
      labels:
        - traefik.enable=true
        - traefik.swarm.network=demo_public
        - traefik.http.routers.backend.rule=PathPrefix(`/api`)
        - traefik.http.routers.backend.entrypoints=web
        - traefik.http.routers.backend.priority=100
        - traefik.http.services.backend.loadbalancer.server.port=8000


  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret-password
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - app_net

networks:
  public:
    name: "demo_public"
    driver: overlay
    attachable: true
  app_net:
    name: "demo_app_net"
    driver: overlay
    attachable: true

volumes:
  pg_data: